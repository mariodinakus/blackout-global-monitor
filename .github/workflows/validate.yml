name: Validate BLACKOUT sources
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for file in app.js live-global.js global-coverage.js planet.js api/*.js; do
            node --check "$file"
          done
      - name: Unit tests
        run: npm test
