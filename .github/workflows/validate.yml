name: Validate BLACKOUT sources
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for file in app.js live-global.js global-coverage.js planet.js api/*.js; do
            node --check "$file"
          done
      - name: Unit tests
        run: npm test
