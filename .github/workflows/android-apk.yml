name: Build BLACKOUT Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android WebView app
        shell: bash
        run: |
          mkdir -p androidapp/app/src/main/java/com/blackout/global androidapp/app/src/main/res/values
          cat > androidapp/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'BLACKOUT'
          include ':app'
          EOF
          cat > androidapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > androidapp/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.blackout.global'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.blackout.global'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.1'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > androidapp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="BLACKOUT" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > androidapp/app/src/main/java/com/blackout/global/MainActivity.java <<'EOF'
          package com.blackout.global;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.content.Intent;
          import android.net.Uri;
          import android.view.View;
          public class MainActivity extends Activity {
              private WebView web;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  web = new WebView(this);
                  web.setBackgroundColor(0xff080b10);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest req) {
                          Uri uri=req.getUrl();
                          if ("blackout-global-monitor.vercel.app".equalsIgnoreCase(uri.getHost())) return false;
                          if ("https".equalsIgnoreCase(uri.getScheme())) {
                              startActivity(new Intent(Intent.ACTION_VIEW,uri));
                          }
                          return true;
                      }
                  });
                  web.loadUrl("https://blackout-global-monitor.vercel.app/");
              }
              @Override public void onBackPressed() {
                  if(web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
              @Override public void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          EOF
      - name: Build APK
        run: cd androidapp && gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-Android-APK
          path: androidapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
